# =============================================================================
# quarkus-perf — Application Configuration
# All settings can be overridden via environment variables using the pattern:
#   config key "quarkus.http.port" → env var "QUARKUS_HTTP_PORT"
#   config key "chaos.db.leak.enabled" → env var "CHAOS_DB_LEAK_ENABLED"
# =============================================================================

# ── HTTP server ───────────────────────────────────────────────────────────────
quarkus.http.port=8080
quarkus.http.host=0.0.0.0

# HTTP idle timeout — keep-alive window; raise via CHAOS_HTTP_IDLE_TIMEOUT_S
# to amplify large-response heap pressure (more connections alive simultaneously)
quarkus.http.idle-timeout=30S

# Max connections kept alive per server (Vert.x default is unbound; set to cap)
quarkus.http.so-reuse-port=false

# ── Database (H2 embedded for local/dev; override for PostgreSQL in prod) ─────
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:quarkusperf;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
quarkus.datasource.username=sa
quarkus.datasource.password=

# Agroal connection pool
# Lower quarkus.datasource.jdbc.max-size to trigger connection starvation
quarkus.datasource.jdbc.min-size=2
quarkus.datasource.jdbc.max-size=${DB_MAX_POOL_SIZE:20}
quarkus.datasource.jdbc.acquisition-timeout=5S
quarkus.datasource.jdbc.idle-removal-interval=60S

# ── Quarkus thread pool ───────────────────────────────────────────────────────
# Reducing QUARKUS_THREAD_POOL_MAX reveals thread starvation
quarkus.thread-pool.core-threads=${THREAD_POOL_CORE:10}
quarkus.thread-pool.max-threads=${THREAD_POOL_MAX:200}

# ── Health checks ─────────────────────────────────────────────────────────────
quarkus.smallrye-health.root-path=/q/health
quarkus.smallrye-health.liveness-path=/q/health/live
quarkus.smallrye-health.readiness-path=/q/health/ready
quarkus.smallrye-health.startup-path=/q/health/started

# ── OpenAPI / Swagger UI ──────────────────────────────────────────────────────
quarkus.smallrye-openapi.path=/openapi
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger-ui

# ── Logging (structured JSON for OTEL / log aggregation) ─────────────────────
quarkus.log.console.enable=true
quarkus.log.console.json=true
quarkus.log.console.json.pretty-print=false
quarkus.log.level=INFO
quarkus.log.category."ai.causa".level=DEBUG

# ── OpenTelemetry ─────────────────────────────────────────────────────────────
# Point to your OTEL collector; defaults to OTLP gRPC on localhost:4317
# Override via QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT env var in Kubernetes
quarkus.otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
quarkus.otel.resource.attributes=service.name=quarkus-perf,service.version=1.0.0
quarkus.otel.sdk.disabled=${OTEL_SDK_DISABLED:false}

# Traces — sample 100% by default; tune via OTEL_TRACES_SAMPLER_ARG
quarkus.otel.traces.sampler=parentbased_traceidratio
quarkus.otel.traces.sampler.arg=${OTEL_TRACES_SAMPLER_ARG:1.0}

# ── Micrometer / Prometheus scrape endpoint ───────────────────────────────────
# Exposed at GET /q/metrics (Prometheus text format)
quarkus.micrometer.export.prometheus.enabled=true
quarkus.micrometer.export.prometheus.path=/q/metrics

# ── Chaos knobs (all defaulted off; activate via env vars) ────────────────────

# DB connection-pool chaos
# CHAOS_DB_LEAK_ENABLED=true  — connections never returned to pool
chaos.db.leak.enabled=${CHAOS_DB_LEAK_ENABLED:false}
# CHAOS_DB_SLOW_QUERY_MS=500  — sleep per JDBC call in ms
chaos.db.slow-query-ms=${CHAOS_DB_SLOW_QUERY_MS:0}

# JVM heap leak chaos
# CHAOS_MEMORY_CACHE_ENABLED=true  — unbounded static map never evicted
chaos.memory.cache.enabled=${CHAOS_MEMORY_CACHE_ENABLED:false}
# CHAOS_MEMORY_OBJECTS_PER_TX=5  — 64KB objects cached per transaction
chaos.memory.objects-per-tx=${CHAOS_MEMORY_OBJECTS_PER_TX:1}

# HTTP large-response chaos
# CHAOS_HTTP_LARGE_RESPONSE_ENABLED=true  — pad every response with Base64 data
chaos.http.large-response.enabled=${CHAOS_HTTP_LARGE_RESPONSE_ENABLED:false}
# CHAOS_HTTP_LARGE_RESPONSE_KB=256  — padding size per response (KB)
chaos.http.large-response.kb=${CHAOS_HTTP_LARGE_RESPONSE_KB:256}
# CHAOS_HTTP_IDLE_TIMEOUT_ENABLED=true  — extend idle timeout to amplify keep-alive pressure
chaos.http.idle-timeout.enabled=${CHAOS_HTTP_IDLE_TIMEOUT_ENABLED:false}
# CHAOS_HTTP_IDLE_TIMEOUT_S=60  — idle timeout in seconds when enabled
chaos.http.idle-timeout-s=${CHAOS_HTTP_IDLE_TIMEOUT_S:60}
